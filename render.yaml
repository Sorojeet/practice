# Render blueprint: New + > Blueprint, then pick this repository.
services:
  - type: web
    name: gridglass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: uploaded files live in this process's memory. Threads give concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SITE_URL
        value: https://gridglass.in
      - key: MAX_UPLOAD_MB
        value: "40"
      - key: TOOL_MAX_ROWS
        value: "300000"
