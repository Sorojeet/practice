<section class="explore" id="tools" aria-labelledby="exploreh">
  <h2 id="exploreh">Explore more tools</h2>
  <p class="muted">Free tools that open the same Excel and CSV files. Nothing to install.</p>
  <div class="cards">
    {% for t in tools %}
    <a class="glass tool-card" href="/tools/{{ t.slug }}">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ t.icon | safe }}</svg>
      <h3>{{ t.name }}</h3><p>{{ t.tagline }}</p><span class="go">Open tool →</span>
    </a>
    {% endfor %}
  </div>
</section>
